name: Pebble
options:
  bundleIdPrefix: com.pebble
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Pebble:
    type: application
    platform: iOS
    sources:
      - path: Pebble
        excludes:
          - "**/*.entitlements"
    info:
      properties:
        CFBundleDisplayName: Pebble
        UILaunchScreen:
          UIColorName: LaunchBackgroundColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NFCReaderUsageDescription: "Pebble uses NFC to read your physical Pebble tag for locking and unlocking distracting apps."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pebble.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_VERSION: "5.9"

schemes:
  Pebble:
    build:
      targets:
        Pebble: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
