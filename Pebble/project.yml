name: Pebble
options:
  bundleIdPrefix: com.pebble
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Pebble:
    type: application
    platform: iOS
    sources:
      - Pebble
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pebbledevice.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NFCReaderUsageDescription: "Pebble uses NFC to read your physical Pebble tag for locking and unlocking distracting apps."
        CODE_SIGN_ENTITLEMENTS: Pebble/Pebble.entitlements
    dependencies:
      - target: PebbleShield

  PebbleShield:
    type: app-extension
    platform: iOS
    sources:
      - PebbleShield
    info:
      path: PebbleShield/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pebbledevice.app.shield
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_ENTITLEMENTS: PebbleShield/PebbleShield.entitlements
    entitlements:
      path: PebbleShield/PebbleShield.entitlements

schemes:
  Pebble:
    build:
      targets:
        Pebble: all
        PebbleShield: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
